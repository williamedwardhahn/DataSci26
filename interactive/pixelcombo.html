<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Image Combinatorics — DataSci26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">
<style>
  .palette { display: grid; grid-template-columns: repeat(auto-fill, minmax(14px, 1fr));
             gap: 1px; border: 1px solid var(--rule-soft); padding: 1px; }
  .palette div { aspect-ratio: 1; }
  .scale { border-collapse: collapse; width: 100%; font: 400 0.78rem/1.5 var(--mono);
           font-variant-numeric: tabular-nums; }
  .scale th { text-align: left; font-weight: 500; color: var(--ink-3);
              font-size: 0.68rem; letter-spacing: .1em; text-transform: uppercase;
              border-bottom: 1px solid var(--rule); padding: 0 0 6px; }
  .scale td { padding: 7px 0; border-bottom: 1px solid var(--rule-soft); color: var(--ink-2); }
  .scale td:last-child { text-align: right; }
  .scale tr[data-passed="yes"] td { color: var(--live); }
  .scale tr.you td { color: var(--ink); font-weight: 500; }
  .scale tr.you td:first-child::before { content: "▸ "; color: var(--live); }
</style>
</head>
<body>

<main class="plate">

  <p class="lede">
    How many different images of a given size exist? The count is
    <strong>(2<sup>bits</sup>)<sup>pixels</sup></strong>, and it leaves the physical
    universe behind almost immediately. This is why you cannot find a good image by searching.
  </p>

  <div>
    <section class="panel panel--sticky">
      <h2>Parameters</h2>

      <div class="field">
        <label for="dim">Image size <span class="field-value" id="dimLabel">8 × 8</span></label>
        <input id="dim" type="range" min="2" max="64" value="8">
      </div>

      <div class="field">
        <label for="bits">Bits per pixel <span class="field-value" id="bitsLabel">4</span></label>
        <input id="bits" type="range" min="1" max="12" value="4">
      </div>

      <div class="field">
        <span class="field-label">Channel</span>
        <div class="segmented" role="radiogroup" aria-label="Channel">
          <label><input type="radio" name="mode" value="gray" checked><span>Grayscale</span></label>
          <label><input type="radio" name="mode" value="rgb"><span>RGB</span></label>
        </div>
      </div>

      <div class="field">
        <button type="button" id="reroll">Draw another</button>
      </div>

      <dl class="stats">
        <div class="stat"><dt>Pixels</dt><dd id="statPix">64</dd></div>
        <div class="stat"><dt>Palette</dt><dd id="statPal">16</dd></div>
      </dl>
    </section>
  </div>

  <div>
    <section class="panel">
      <h2>Figure</h2>
      <div class="figs figs--2">
        <figure>
          <canvas id="canvas" width="256" height="256" class="pixelated"></canvas>
          <figcaption><b>Fig. 1</b> One image drawn uniformly at random from the space below.</figcaption>
        </figure>
        <figure>
          <div class="palette" id="paletteBox"></div>
          <figcaption><b>Fig. 2</b> <span id="palCap">The palette every pixel chooses from.</span></figcaption>
        </figure>
      </div>
    </section>

    <section class="panel">
      <h2>The count</h2>
      <div class="readout" id="outputBox"></div>
    </section>

    <section class="panel">
      <h2>For scale</h2>
      <table class="scale">
        <thead><tr><th>Quantity</th><th>Roughly</th></tr></thead>
        <tbody id="scaleBody"></tbody>
      </table>
      <p class="note" id="verdict"></p>
    </section>
  </div>

</main>

<script src="lab.js"></script>
<script>
Lab.head({ no: 'Plate 05', title: 'Image Combinatorics' });

const $ = Lab.$;
const dimEl = $('#dim'), bitsEl = $('#bits');
const canvas = $('#canvas'), ctx = canvas.getContext('2d');

/* Reference magnitudes, as powers of ten. */
const SCALE = [
  ['Grains of sand on Earth',        19],
  ['Atoms in a human body',          27],
  ['Stars in the observable universe',24],
  ['Atoms in the observable universe',80],
  ['Legal chess games (Shannon)',    120],
  ['Planck volumes in the universe', 185],
];

const mode = () => document.querySelector('input[name=mode]:checked').value;

/* Split a bit budget across three channels without ever going negative --
   the original split could hand blue a count of -1 bits at low depths. */
function channelBits(bits) {
  const r = Math.ceil(bits / 3);
  const g = Math.ceil((bits - r) / 2);
  return [r, g, bits - r - g];
}

function palette(bits, m) {
  const out = [];
  if (m === 'gray') {
    const levels = 2 ** bits;
    for (let i = 0; i < levels; i++) {
      const v = levels === 1 ? 0 : Math.round(255 * i / (levels - 1));
      out.push(`rgb(${v},${v},${v})`);
    }
    return out;
  }
  const [br, bg, bb] = channelBits(bits);
  const step = (i, n) => n <= 1 ? 0 : Math.round(255 * i / (n - 1));
  const R = 2 ** br, G = 2 ** bg, B = 2 ** bb;
  for (let r = 0; r < R; r++)
    for (let g = 0; g < G; g++)
      for (let b = 0; b < B; b++) {
        out.push(`rgb(${step(r, R)},${step(g, G)},${step(b, B)})`);
        if (out.length >= 4096) return out;
      }
  return out;
}

function draw(d, pal) {
  const cell = canvas.width / d;
  for (let y = 0; y < d; y++)
    for (let x = 0; x < d; x++) {
      ctx.fillStyle = pal[Math.floor(Math.random() * pal.length)];
      ctx.fillRect(x * cell, y * cell, Math.ceil(cell), Math.ceil(cell));
    }
}

function update(redraw = true) {
  const d = +dimEl.value, bits = +bitsEl.value, m = mode();
  const pixels = d * d;
  const paletteSize = 2 ** bits;
  /* log10 of (2^bits)^pixels, done in logs so it never overflows */
  const exp = Math.floor(pixels * bits * Math.log10(2));

  $('#dimLabel').textContent = `${d} × ${d}`;
  $('#bitsLabel').textContent = `${bits} (${paletteSize.toLocaleString()} levels)`;
  $('#statPix').textContent = pixels.toLocaleString();
  $('#statPal').textContent = paletteSize.toLocaleString();

  const pal = palette(bits, m);
  if (redraw) draw(d, pal);

  $('#paletteBox').innerHTML = '';
  pal.slice(0, 1024).forEach(c => {
    const el = document.createElement('div');
    el.style.background = c;
    $('#paletteBox').append(el);
  });
  $('#palCap').textContent = pal.length > 1024
    ? `First 1,024 of ${pal.length.toLocaleString()} colours.`
    : `All ${pal.length.toLocaleString()} colour${pal.length === 1 ? '' : 's'} a pixel can take.`;

  $('#outputBox').innerHTML =
    `pixels          ${pixels.toLocaleString()}\n` +
    `values / pixel  ${paletteSize.toLocaleString()}   (2^${bits})\n\n` +
    `distinct images = (2^${bits})^${pixels.toLocaleString()}\n` +
    `                = 2^${(pixels * bits).toLocaleString()}\n` +
    `                &asymp; <em>10^${exp.toLocaleString()}</em>`;

  const rows = SCALE.map(([label, e]) =>
    `<tr data-passed="${exp > e ? 'yes' : 'no'}"><td>${label}</td><td>10<sup>${e}</sup></td></tr>`);
  rows.push(`<tr class="you"><td>Images this size</td><td>10<sup>${exp.toLocaleString()}</sup></td></tr>`);
  $('#scaleBody').innerHTML = rows.join('');

  const beaten = SCALE.filter(([, e]) => exp > e).length;
  $('#verdict').textContent = beaten === 0
    ? 'Still a countable space — for now. Push the size slider.'
    : beaten === SCALE.length
      ? 'Larger than every quantity above, combined and then some. No search will ever reach it — which is the whole argument for learning a model instead.'
      : `Already larger than ${beaten} of the ${SCALE.length} quantities above.`;
}

[dimEl, bitsEl].forEach(el => el.addEventListener('input', () => update(true)));
Lab.$$('input[name=mode]').forEach(r => r.addEventListener('change', () => update(true)));
$('#reroll').addEventListener('click', () => update(true));

update();
Lab.foot();
</script>
</body>
</html>
